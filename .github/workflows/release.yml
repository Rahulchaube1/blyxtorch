name: Test and release BlyxTorch
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: linux-x64, file: blyxtorch }
          - { os: windows-latest, target: windows-x64, file: blyxtorch.exe }
          - { os: macos-latest, target: macos-arm64, file: blyxtorch }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Rahulchaube1/blyxtorch-verification
          ref: 4a4ab37aa6f966d3c8b85440d5620637bf9d88df
          path: reference-tools
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: cargo install --locked --git https://github.com/Rahulchaube1/blyxxxx --rev 120d6b6ec6df09ff018d7c18752fb3297b5e629d blyxc
      - run: blyxc native-run tests.blyx
      - run: blyxc native-run example.blyx
      - run: blyxc native-run layer_tests.blyx
      - run: blyxc native-run sequence_example.blyx
      - name: Run both portable projects
        shell: bash
        run: |
          diff -u <(printf '18.625\n22.375\n') <(blyxc run projects/sensor-calibration.blyx | tr -d '\r')
          diff -u <(printf 'short wait\nlong wait\nshort wait\nlong wait\n') <(blyxc run projects/queue-classifier.blyx | tr -d '\r')
      - name: Build in a clean installation directory
        shell: bash
        run: |
          mkdir -p build dist
          blyxc build main.blyx -o build/${{ matrix.file }}
          cp blyxtorch.blyx training.blyx tensor_ops.blyx convolution.blyx attention.blyx transformer.blyx embedding.blyx sequence_example.blyx probe.blyx probe_cli.blyx probe_graph.blyx layer_graph.blyx numeric_io.blyx LAYERS.md PORTABLE.md build/
          cp reference-tools/device_fit.py reference-tools/provider-tools.mjs build/
      - run: python reference-tools/test_cli.py --source . --exe build/${{ matrix.file }}
      - run: python reference-tools/test_embeddings.py build/${{ matrix.file }}
      - run: python reference-tools/test_portable.py build/${{ matrix.file }}
      - run: node reference-tools/test-provider-tools.mjs build/${{ matrix.file }}
      - name: Check the dense parameter estimate
        shell: bash
        run: build/${{ matrix.file }} transformer-plan 128 32768 128 131072 128000 | jq -e '.total_parameters == 1653516337152 and .dense_fp64_weight_bytes == 13228130697216'
      - name: Verify the specialized dense emitter at 1,024 parameters
        if: runner.os == 'Linux'
        run: python reference-tools/test_cli.py --source . --exe build/blyxtorch --largest
      - name: Package the tested installation
        shell: bash
        run: |
          cp -r fixtures assets projects README.md LICENSE-MIT LICENSE-APACHE build/
          cd build
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            7z a "../dist/blyxtorch-${{ matrix.target }}.zip" *
          else
            tar -czf "../dist/blyxtorch-${{ matrix.target }}.tar.gz" *
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: blyxtorch-${{ matrix.target }}
          path: dist/*
  reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Rahulchaube1/blyxtorch-verification
          ref: 4a4ab37aa6f966d3c8b85440d5620637bf9d88df
          path: reference-tools
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: cargo install --locked --git https://github.com/Rahulchaube1/blyxxxx --rev 120d6b6ec6df09ff018d7c18752fb3297b5e629d blyxc
      - run: python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.8.0
      - run: blyxc build main.blyx -o blyxtorch
      - run: python reference-tools/pytorch_reference.py --exe ./blyxtorch
      - run: blyxc build layer_tests.blyx -o layer-tests
      - run: python reference-tools/layer_reference.py ./layer-tests
      - run: python -m pip install numpy iree-base-compiler==3.14.0 iree-base-runtime==3.14.0
      - run: cp reference-tools/device_fit.py .
      - run: python reference-tools/test_portable.py ./blyxtorch --device cpu
      - run: python reference-tools/device_layers.py device-fixtures.npz --generate
      - run: python reference-tools/device_layers.py device-fixtures.npz --cli ./blyxtorch --device cpu
  editor:
    needs: native
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          pattern: blyxtorch-*
          path: dist
          merge-multiple: true
      - name: Package the universal VSIX and editable starter
        shell: bash
        run: |
          set -eu
          version=$(jq -r .version editor/package.json)
          stage="$RUNNER_TEMP/blyxtorch-extension"
          mkdir -p "$stage/snippets" output
          cp -r editor/. "$stage/"
          cp assets/logo.png "$stage/logo.png"
          cat LICENSE-MIT LICENSE-APACHE > "$stage/LICENSE.txt"
          cp -r projects "$stage/projects"
          for platform in linux-x64 macos-arm64 windows-x64; do
            dest="$stage/native/$platform"
            mkdir -p "$dest"
            if [[ "$platform" == windows-x64 ]]; then
              unzip -q dist/blyxtorch-windows-x64.zip blyxtorch.exe blyxtorch.blyx training.blyx device_fit.py -d "$dest"
            else
              tar -xzf "dist/blyxtorch-$platform.tar.gz" -C "$dest" blyxtorch blyxtorch.blyx training.blyx device_fit.py
              chmod 755 "$dest/blyxtorch"
            fi
          done
          jq -n --rawfile sensor projects/sensor-calibration.blyx --rawfile queue projects/queue-classifier.blyx '
            def template($prefix; $text): {prefix: $prefix, isFileTemplate: true, body: ($text | rtrimstr("\n") | split("\n"))};
            {"BlyxTorch: Fit a desk sensor": template("bt-sensor"; $sensor),
             "BlyxTorch: Classify print jobs": template("bt-queue"; $queue)}
          ' > "$stage/snippets/projects.json"
          (cd projects && zip -qr "../output/blyxtorch-projects-$version.zip" .)
          (cd "$stage" && npx --yes @vscode/vsce@4.1.1 package --no-dependencies --allow-missing-repository --out "$GITHUB_WORKSPACE/output/blyxtorch-$version.vsix")
          unpack="$RUNNER_TEMP/blyxtorch-installed"
          unzip -q "output/blyxtorch-$version.vsix" -d "$unpack"
          cmp assets/logo.png "$unpack/extension/logo.png"
          native="$unpack/extension/native/linux-x64/blyxtorch"
          test -x "$native" && test -x "$unpack/extension/native/macos-arm64/blyxtorch"
          runtime_version=$(awk -F '"' '/^version = / {print $2; exit}' Blyx.toml)
          test "$("$native" --version)" = "BlyxTorch $runtime_version"
          "$native" train-score projects/print-queue/train.csv projects/print-queue/holdout.csv 180 0.03 4 adam 7 | jq -e '.rows == 6 and .mean_loss < 0.01'
      - uses: actions/upload-artifact@v4
        with:
          name: blyxtorch-editor
          path: output/*
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [native, reference, editor]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: cd dist && sha256sum *.zip *.tar.gz *.vsix > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body: |
            Fit a classifier or multi-output regressor on a CPU, or run its Blyx-generated training graph on a Vulkan GPU. The release includes editable starter projects, native trainers for three platforms and the universal editor extension.

            Export 2D convolution and attention forward and backward passes as StableHLO. Resume a checkpoint across native and device trainers or call a saved classifier from an OpenAI or Claude application. The device host and model-provider bridge are optional.

            [Installation and examples](https://github.com/Rahulchaube1/blyxtorch/blob/v0.4.0/PORTABLE.md) · [Experiments and raw results](https://www.blyx-lang.space/articles/blyxtorch-portable-training) · [Training handbook](https://doc.blyx-lang.space/guide/blyxtorch)
